server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: rag-backend

  datasource:
    # Defaults match the local-only database in docker-compose.yml.
    # For any other database, set DB_URL, DB_USERNAME and DB_PASSWORD in the environment.
    url: ${DB_URL:jdbc:postgresql://localhost:5433/ragdb}
    username: ${DB_USERNAME:rag}
    password: ${DB_PASSWORD:rag_local_dev}

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

  ai:
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      init:
        # Downloads the two models on first start if they are not on the machine yet.
        pull-model-strategy: when_missing
      chat:
        options:
          model: ${OLLAMA_CHAT_MODEL:llama3.2}
          temperature: 0.2
      embedding:
        options:
          model: ${OLLAMA_EMBEDDING_MODEL:nomic-embed-text}
    vectorstore:
      pgvector:
        # Creates the vector_store table (and the vector extension) on startup.
        initialize-schema: true
        # Must match the embedding model: nomic-embed-text produces 768 numbers.
        dimensions: 768
        index-type: HNSW
        distance-type: COSINE_DISTANCE

app:
  jwt:
    # Any text of at least 32 characters. Left empty, a random key is made at
    # startup, so every restart logs everyone out. Set JWT_SECRET to keep logins.
    secret: ${JWT_SECRET:}
    expiry-minutes: 720
  rag:
    chunk-words: 220
    chunk-overlap-words: 40
    top-k: 5
    similarity-threshold: 0.3
